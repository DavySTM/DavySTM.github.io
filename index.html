<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🎄 Secret Santa</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@400;700&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="garland">
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
    </div>

    <div id="snow"></div>

    <main class="page">

        <section class="card">

            <div class="top-decoration">
                <span>✦</span>
                <span>🎄</span>
                <span>✦</span>
            </div>

            <div class="santa-icon">
                🎅
            </div>

            <h1>
                Secret Santa
            </h1>

            <p class="intro">
                Une surprise de Noël<br>
                t'attend...
            </p>

            <div id="content">

                <div class="locked-box">

                    <div class="lock-icon">
                        🔐
                    </div>

                    <h2>
                        Entre ton code secret
                    </h2>

                    <p>
                        Le code t'a été transmis
                        personnellement.<br>
                        Il te permettra de découvrir
                        ton Secret Santa.
                    </p>

                    <form id="codeForm">

                        <input
                            type="text"
                            id="secretCode"
                            placeholder="Ex : X1T2FF"
                            maxlength="6"
                            autocomplete="off"
                            spellcheck="false"
                            required
                        >

                        <button
                            type="submit"
                            class="reveal-button"
                        >
                            🎁 Découvrir
                        </button>

                    </form>

                    <p
                        id="error"
                        class="error-message"
                    ></p>

                </div>

            </div>

            <div class="bottom-decoration">
                ❄️ ❄️ ❄️
            </div>

        </section>

        <footer>
            Fait avec ❤️ pour Noël
        </footer>

    </main>

    <script src="app.js"></script>

</body>
</html>
